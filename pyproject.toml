[project]
name = "ai-radar"
version = "0.1.0"
description = "Monitor podcasts, YouTube, blogs, and X for substantial AI lab material, then classify, summarize, and publish one deduplicated feed."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ai-radar = "podcast_radar.cli:main"
podcast-radar = "podcast_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is named ai-radar but the import package is podcast_radar,
# so hatchling cannot infer what to ship and refuses to build without this.
[tool.hatch.build.targets.wheel]
packages = ["podcast_radar"]
