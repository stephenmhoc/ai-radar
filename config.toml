[app]
timezone = "America/New_York"
database_path = "var/radar.sqlite3"
public_dir = "public"
state_dir = "var"
lookback_days = 14
user_agent = "ai-radar/0.1"

[llm]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openai/gpt-4.1-mini"
temperature = 0.1
max_metadata_chars = 12000
max_transcript_chars = 130000

[transcription]
provider = "command"
command = "whisper-cli"
args = ["-m", "models/ggml-large-v3-turbo.bin", "-f", "{audio_path}", "-otxt", "-of", "{output_stem}"]
output_path = "{output_stem}.txt"
audio_dir = "var/audio"
transcript_dir = "var/transcripts"
max_audio_mb = 750
keep_audio = false

[site]
title = "AI Radar"
description = "Podcast episodes featuring technical leaders and executives from major AI labs."
base_url = "https://llm-podcasts.merimerimeri.com"
cname = "llm-podcasts.merimerimeri.com"
max_items = 100
rss_title = "AI Radar"
rss_description = "New podcast episodes featuring major AI lab guests."

