[app]
timezone = "America/New_York"
database_path = "var/radar.sqlite3"
public_dir = "public"
state_dir = "var"
processed_after = "2026-01-01"
lookback_days = 14
user_agent = "ai-radar/0.1"

[llm]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "minimax/minimax-m3"
temperature = 0.1
max_metadata_chars = 12000
max_transcript_chars = 130000

[transcription]
provider = "command"
command = "whisper-cli"
args = ["-m", "/Users/merimerimeri/.cache/whisper.cpp/ggml-small.en.bin", "-f", "{audio_path}", "-otxt", "-of", "{output_stem}", "-l", "en", "-bs", "1", "-bo", "1", "-np", "--prompt", "AI podcast transcript. Common terms: OpenAI, Anthropic, Google DeepMind, DeepMind, Meta AI, xAI, NVIDIA, ChatGPT, Claude, Gemini, GPT-4, GPT-5, GPT-5.1, o3, Sora, Codex, MCP, model behavior, post-training, reinforcement learning, reasoning models, steerability, inference, agents. Episode metadata: {feed_name}. {episode_title}. Hosts: {episode_hosts}. Description: {episode_description}"]
output_path = "{output_stem}.txt"
audio_dir = "var/audio"
transcript_dir = "var/transcripts"
max_audio_mb = 750
keep_audio = false

[site]
title = "AI Radar"
description = "Podcast episodes featuring technical leaders and executives from major AI labs."
base_url = "https://ai-radar.merimerimeri.com"
cname = "ai-radar.merimerimeri.com"
max_items = 250
rss_title = "AI Radar"
rss_description = "New podcast episodes featuring major AI lab guests."

