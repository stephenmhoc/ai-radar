[app]
public_dir = "public"
user_agent = "ai-radar/0.1"

[llm]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openrouter/auto"
temperature = 0.1
max_metadata_chars = 12000
timeout_seconds = 120
max_attempts = 4
retry_backoff_seconds = 2.0
max_retry_sleep_seconds = 60.0
max_output_tokens = 2400

[editions]
# The site and RSS feed are organized into daily editions. An edition closes at
# this local hour and covers everything AI Radar published since the previous
# close; RSS gets one entry per edition.
timezone = "America/New_York"
hour = 19

[site]
title = "AI Radar"
description = "Noteworthy AI conversations and writing, summarized from publisher notes."
base_url = "https://ai-radar.merimerimeri.com"

