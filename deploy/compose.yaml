services:
  worker:
    build:
      context: ./repo
      dockerfile: deploy/Dockerfile
    image: ai-radar:static
    container_name: ai-radar
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["sleep", "infinity"]
    environment:
      TZ: America/New_York
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AI_RADAR_LOOKBACK_DAYS: ${AI_RADAR_LOOKBACK_DAYS:-7}
      GIT_AUTHOR_NAME: AI Radar
      GIT_AUTHOR_EMAIL: ai-radar@users.noreply.github.com
      GIT_COMMITTER_NAME: AI Radar
      GIT_COMMITTER_EMAIL: ai-radar@users.noreply.github.com
    volumes:
      - ./repo:/app
      - ./secrets/github_deploy_key:/run/secrets/github_deploy_key:ro
      - ./secrets/github_known_hosts:/run/secrets/github_known_hosts:ro
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.ai-radar.schedule: "0 17 * * * *"
      ofelia.job-exec.ai-radar.command: "/app/deploy/run-cycle.sh"
      ofelia.job-exec.ai-radar.no-overlap: "true"
    logging:
      options:
        max-size: 10m
        max-file: "3"
