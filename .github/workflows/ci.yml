name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify publisher
        run: python scripts/verify.py
      - name: Guard append-only archive evolution
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:data/items.json" > /tmp/ai-radar-base-items.json
          python scripts/check_archive_evolution.py /tmp/ai-radar-base-items.json data/items.json

  container:
    name: Container and Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose templates
        env:
          OPENROUTER_API_KEY: test
          AI_RADAR_SENTRY_DSN: test
        run: |
          docker compose --project-directory . --file deploy/compose.yaml config --quiet
          docker compose --project-directory . --file deploy/scheduler.compose.yaml config --quiet
      - name: Check shell entrypoint
        run: shellcheck deploy/run-cycle.sh
      - name: Build worker image
        run: docker build --file deploy/Dockerfile --tag ai-radar-ci .
      - name: Verify worker image
        run: docker run --rm ai-radar-ci python3 scripts/verify.py
